<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tescra - Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a5c8e 0%, #2bcbba 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .error-container {
      text-align: center;
      padding: 40px;
    }
    
    .error-code {
      font-size: 120px;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }
    
    .error-title {
      font-size: 32px;
      margin-bottom: 16px;
    }
    
    .error-message {
      font-size: 18px;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    
    .home-button {
      display: inline-block;
      padding: 12px 32px;
      background: white;
      color: #0a5c8e;
      text-decoration: none;
      border-radius: 48px;
      font-weight: 600;
      transition: transform 0.3s ease;
    }
    
    .home-button:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-button">Return to Homepage</a>
  </div>
</body>
</html>
